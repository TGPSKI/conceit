name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

# Cancel superseded runs on the same ref (saves runner minutes on busy PRs).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Pinned deliberately. An unpinned shellcheck means CI lints with a different
  # version than you do, and the two disagree — 0.9.0 flags SC2015 where 0.11.0
  # does not. Bump this and re-run `make check` locally in the same change.
  SHELLCHECK_VERSION: "0.11.0"

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Fast-feedback gate. Runs on every push and PR.
  # A GPU build cannot run here, so CI gates everything else: the scripts
  # that drive the build, the skill, and the patches themselves.
  # ─────────────────────────────────────────────────────────────────────────
  ci:
    name: Build & Test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        # actions/checkout v6.0.2 (Node.js 24)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install shellcheck ${{ env.SHELLCHECK_VERSION }}
        run: |
          case "$(uname -s)-$(uname -m)" in
            Linux-x86_64)   target=linux.x86_64 ;;
            Linux-aarch64)  target=linux.aarch64 ;;
            Darwin-arm64)   target=darwin.aarch64 ;;
            Darwin-x86_64)  target=darwin.x86_64 ;;
            *) echo "no shellcheck build for $(uname -s)-$(uname -m)"; exit 1 ;;
          esac
          v="$SHELLCHECK_VERSION"
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/v$v/shellcheck-v$v.$target.tar.xz" \
            | tar -xJf -
          sudo install "shellcheck-v$v/shellcheck" /usr/local/bin/shellcheck
          rm -rf "shellcheck-v$v"
          shellcheck --version

      # Delegate to the Makefile so CI and a local `make check` cannot drift.
      - name: Lint + syntax check
        run: make check

      - name: Validate skill frontmatter
        run: |
          ok=true
          for skill in .agents/skills/*/SKILL.md; do
            [ -f "$skill" ] || continue
            for field in name description metadata; do
              grep -q "^${field}:" "$skill" || {
                echo "FAIL: $skill is missing frontmatter field: $field"
                ok=false
              }
            done
          done
          $ok || exit 1
          echo "skill frontmatter: OK"

      # Patches are the product here, so a malformed one is a build break.
      - name: Validate patches
        run: |
          ok=true
          found=0
          for patch in patches/*/*.patch; do
            [ -f "$patch" ] || continue
            found=$((found + 1))
            if grep -q '^--- ' "$patch" && grep -q '^+++ ' "$patch"; then
              echo "OK: $patch"
            else
              echo "FAIL: $patch is not a unified diff (no ---/+++ header)"
              ok=false
            fi
          done
          [ "$found" -gt 0 ] || { echo "FAIL: no patches found — patches/ is the product"; exit 1; }
          $ok || exit 1

  # ─────────────────────────────────────────────────────────────────────────
  # Cross-platform full-scope tests.
  # Triggers:
  #   - PR carrying the `full-test` label
  #   - manual workflow_dispatch
  #   - any push to main
  # ─────────────────────────────────────────────────────────────────────────
  full-scope:
    name: Full-scope (${{ matrix.label }})
    needs: ci
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
        contains(github.event.pull_request.labels.*.name, 'full-test')) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux/arm64
            os: ubuntu-24.04-arm
          - label: macos/arm64
            os: macos-14
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        # actions/checkout v6.0.2 (Node.js 24)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install shellcheck ${{ env.SHELLCHECK_VERSION }}
        run: |
          case "$(uname -s)-$(uname -m)" in
            Linux-x86_64)   target=linux.x86_64 ;;
            Linux-aarch64)  target=linux.aarch64 ;;
            Darwin-arm64)   target=darwin.aarch64 ;;
            Darwin-x86_64)  target=darwin.x86_64 ;;
            *) echo "no shellcheck build for $(uname -s)-$(uname -m)"; exit 1 ;;
          esac
          v="$SHELLCHECK_VERSION"
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/v$v/shellcheck-v$v.$target.tar.xz" \
            | tar -xJf -
          sudo install "shellcheck-v$v/shellcheck" /usr/local/bin/shellcheck
          rm -rf "shellcheck-v$v"
          shellcheck --version

      - name: Lint + syntax check
        run: make check
