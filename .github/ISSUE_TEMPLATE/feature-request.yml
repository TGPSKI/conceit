name: Feature Request
description: Suggest a new feature or improvement
labels: [enhancement]
body:
  - type: dropdown
    id: component
    attributes:
      label: Which component?
      options:
        - PyTorch build
        - vllm build
        - llama.cpp build
        - build scripts (cuda-env.sh / build-upstream.sh)
        - Makefile
        - build-triage skill
        - New component
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What pain point or gap does this address?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you implement or address this?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What other approaches did you consider?
